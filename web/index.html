<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Show Scheduler</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    h1 { margin-bottom: 1.5rem; }

    .form-row { margin-bottom: 1rem; }
    label { display: block; font-weight: bold; margin-bottom: 0.25rem; }
    textarea { width: 100%; font-family: monospace; font-size: 0.85rem; box-sizing: border-box; }
    input[type=number] { width: 8rem; padding: 0.25rem; }

    button {
      padding: 0.5rem 1.5rem;
      background: #1a6fc4;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:disabled { background: #888; cursor: default; }

    #status { margin: 1rem 0; font-style: italic; color: #555; }

    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.4rem 0.7rem; text-align: left; }
    th { background: #f0f0f0; }
    tr:nth-child(even) { background: #fafafa; }

    .intermission { background: #fffbe6 !important; font-style: italic; }
    .has-conflict td { background: #fff0f0 !important; }
    .conflict-names { font-size: 0.8rem; color: #c00; }

    #score { margin: 1rem 0; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Show Scheduler</h1>

  <div class="form-row">
    <label for="csv-input">Routine CSV (header = routine names, rows = dancer names per column):</label>
    <textarea id="csv-input" rows="10" spellcheck="false" placeholder="Paste CSV here..."></textarea>
  </div>

  <div class="form-row">
    <label for="num-slots">Number of show slots (including intermission):</label>
    <input type="number" id="num-slots" value="32" min="1" />
  </div>

  <div class="form-row">
    <label for="num-iter">Optimizer iterations:</label>
    <input type="number" id="num-iter" value="500" min="1" />
  </div>

  <button id="run-btn">Optimize</button>

  <div id="status"></div>
  <div id="score"></div>
  <div id="results"></div>

  <script type="module">
    import init, { parse_csv, optimize } from './pkg/show_scheduler.js';
    await init();

    const btn = document.getElementById('run-btn');
    const status = document.getElementById('status');
    const scoreEl = document.getElementById('score');
    const results = document.getElementById('results');

    btn.addEventListener('click', () => {
      const csv = document.getElementById('csv-input').value.trim();
      const numSlots = parseInt(document.getElementById('num-slots').value);
      const numIter = parseInt(document.getElementById('num-iter').value);

      if (!csv) { status.textContent = 'Please paste a CSV first.'; return; }

      btn.disabled = true;
      status.textContent = `Running ${numIter} iterations… (browser may be unresponsive for a moment)`;
      scoreEl.textContent = '';
      results.innerHTML = '';

      // Defer so the status message renders before WASM blocks the thread.
      setTimeout(() => {
        try {
          const routinesJson = parse_csv(csv);
          const resultJson = optimize(routinesJson, numSlots, numIter);
          const result = JSON.parse(resultJson);

          const [d1, d2, mid] = result.score;
          scoreEl.textContent =
            `Score — distance-1 conflicts: ${d1}, distance-2 conflicts: ${d2}, intermission offset from middle: ${mid}`;

          const table = document.createElement('table');
          table.innerHTML = `
            <tr>
              <th>#</th>
              <th>Routine(s)</th>
              <th>Distance-1 conflicts</th>
              <th>Distance-2 conflicts</th>
            </tr>`;

          for (const slot of result.slots) {
            const tr = document.createElement('tr');
            const name = slot.routines.join(' + ');
            const isIntermission = slot.routines.length === 1 && slot.routines[0] === '[Intermission]';
            const hasConflict = slot.dist1_conflicts.length > 0 || slot.dist2_conflicts.length > 0;

            if (isIntermission) tr.classList.add('intermission');
            if (hasConflict) tr.classList.add('has-conflict');

            tr.innerHTML = `
              <td>${slot.slot_number}</td>
              <td>${name}</td>
              <td><span class="conflict-names">${slot.dist1_conflicts.join(', ')}</span></td>
              <td><span class="conflict-names">${slot.dist2_conflicts.join(', ')}</span></td>`;
            table.appendChild(tr);
          }

          results.appendChild(table);
          status.textContent = 'Done.';
        } catch (err) {
          status.textContent = `Error: ${err}`;
        } finally {
          btn.disabled = false;
        }
      }, 0);
    });
  </script>
</body>
</html>
